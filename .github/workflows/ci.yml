name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20 # room for the Playwright install retry when the Azure apt mirror crawls

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node26-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run quality gate
        run: |
          npm run format:check
          npm run lint
          npm run test:coverage

      - name: Build production site
        env:
          VITE_API_FORMAT: ${{ vars.VITE_API_FORMAT }}
          VITE_MAP_MODEL_BASE_URL: ${{ vars.VITE_MAP_MODEL_BASE_URL }}
          VITE_REPLAY_VIEW_ANALYTICS: ${{ vars.VITE_REPLAY_VIEW_ANALYTICS }}
        run: npm run build

      - name: Validate Cloudflare package without deploying
        run: npm run deploy:dry-run

      # Hands the validated dist/ to the deploy workflow: the Actions policy only
      # allows actions/cache, which saves the path when the job ends. Playwright
      # builds into dist-e2e/, so dist/ is still the production bundle by then.
      - name: Cache production build for deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: dist-${{ github.sha }}-${{ vars.VITE_API_FORMAT || 'legacy' }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The Azure apt mirror can crawl at ~40 KB/s and apt only falls back on errors: retry once without it.
      - name: Install browsers for compatibility tests
        timeout-minutes: 10
        run: |
          if ! timeout 240 npx playwright install --with-deps chromium firefox webkit; then
            echo "::warning::Playwright install failed or took over 240 s; retrying without the Azure apt mirror"
            # timeout cannot signal the root apt-get that sudo started, and it would keep the apt lock.
            sudo pkill -x apt-get || true
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            else
              sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list || true
            fi
            timeout 300 npx playwright install --with-deps chromium firefox webkit
          fi

      - name: Run critical browser flows
        run: npm run test:e2e
