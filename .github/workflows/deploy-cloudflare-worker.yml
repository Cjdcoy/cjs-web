name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.CJS_PRODUCTION_URL }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        env:
          CJS_PRODUCTION_URL: ${{ vars.CJS_PRODUCTION_URL }}
          CLOUDFLARE_ACCOUNT_ID_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          CLOUDFLARE_API_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/check-release-config.mjs

      - name: Build production site
        run: npm run build

      - name: Validate Cloudflare package without deploying
        run: npm run deploy:dry-run

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: >-
            deploy --strict --config wrangler.jsonc
            --message "GitHub ${{ github.event.workflow_run.head_sha || github.sha }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production routes and headers
        env:
          CJS_PRODUCTION_URL: ${{ vars.CJS_PRODUCTION_URL }}
        run: npm run smoke:production
